 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JB BOOK SHOP</title>
  <style>
    body { font-family: Calibri, Arial, sans-serif; margin: 24px; }
    table { border-collapse: collapse; width: 100%; max-width: 700px; }
    th, td { border: 1px solid #333; padding: 8px 10px; text-align: left; vertical-align: middle; }
    th { background-color: #d9d9d9; }
    tr:nth-child(even) td { background-color: #f6f6f6; }
    img { width: 50px; height: 50px; object-fit: cover; display: block; }
  </style>
</head>
<body>

  <h2>Welcome to JB Book Shop</h2>

  <table>
    <thead>
      <tr>
        <th>Product Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>In Stock</th>
        <th>Thumbnail</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>C++ Book</td>
        <td>$10</td>
        <td>10</td>
        <td>YES</td>
        <td><img src="C++ Book.jpg" alt="C++ Book"></td>
      </tr>
      <tr>
        <td>Python Book</td>
        <td>$20</td>
        <td>15</td>
        <td>YES</td>
        <td><img src="Python Book.jpg" alt="Python Book"></td>
      </tr>
      <tr>
        <td>HTML book</td>
        <td>$15</td>
        <td>2</td>
        <td>NO</td>
        <td><img src="HTML Book.jpg" alt="HTML Book"></td>
      </tr>
    </tbody>
  </table>

</body>
</html>
